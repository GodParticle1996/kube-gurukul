# =====================================================================
#  Lab 01 — CrashLoopBackOff + OOMKilled  (exit codes ki kahani)
#  Shuru:  kubectl apply -f setup.yaml
#  Is file mein JAAN-BOOJH KAR 2 galtiyan hain. Unhe dhoondo aur theek karo.
# =====================================================================
apiVersion: v1
kind: Namespace
metadata:
  name: lab01
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: orders-config
  namespace: lab01
data:
  DB_URL: "postgres://orders-db.lab01.svc:5432/orders"
  CACHE_MB: "80"          # app startup par itna data memory mein load karta hai
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders-api
  namespace: lab01
spec:
  replicas: 2
  selector:
    matchLabels:
      app: orders-api
  template:
    metadata:
      labels:
        app: orders-api
    spec:
      containers:
        - name: api
          image: busybox:1.36
          # "app" — asli service jaisa bartav: config check → cache warm-up → serve
          command: ["sh", "-c"]
          args:
            - |
              if [ -z "$DB_URL" ]; then
                echo "FATAL: DB_URL env var nahi mila — config kahan hai?"
                exit 1
              fi
              echo "DB: $DB_URL"
              echo "cache warm-up: ${CACHE_MB}MB memory mein load ho raha hai..."
              CACHE=$(dd if=/dev/zero bs=1048576 count="$CACHE_MB" 2>/dev/null | tr '\0' x)
              echo "cache ready (${#CACHE} bytes) — serving on :8080"
              mkdir -p /www && echo "orders-api ok" > /www/index.html
              exec httpd -f -h /www -p 8080
          env:
            - name: DATABASE_URL
              valueFrom:
                configMapKeyRef:
                  name: orders-config
                  key: DB_URL
            - name: CACHE_MB
              valueFrom:
                configMapKeyRef:
                  name: orders-config
                  key: CACHE_MB
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            periodSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 64Mi
