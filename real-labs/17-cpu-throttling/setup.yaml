# =====================================================================
#  Lab 17 — CPU throttling: "CPU sirf 200m, phir bhi app dheema kyun?"
#  Shuru:  kubectl apply -f setup.yaml
#  Kahani: ChaiPay ka fraud-check har payment par 10 lakh chhoti jaanch karta hai.
#          Yeh kaam EK poora CPU core maangta hai. Par CPU limit sirf 200m hai.
#  Chhupa bug: limit 200m → kernel har 100ms mein sirf 20ms chalne deta hai → kaam ~5 guna dheema.
# =====================================================================
apiVersion: v1
kind: Namespace
metadata:
  name: lab17
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fraud-check
  namespace: lab17
spec:
  replicas: 1
  selector:
    matchLabels: { app: fraud-check }
  template:
    metadata:
      labels: { app: fraud-check }
    spec:
      terminationGracePeriodSeconds: 1
      containers:
        - name: fraud-check
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              # samay /proc/uptime se (centisecond mein) — bina naya process banaye
              now() { read u _ < /proc/uptime; echo "${u%.*}${u#*.}"; }
              while true; do
                a=$(now); n=0
                while [ $n -lt 1000000 ]; do n=$((n+1)); done
                b=$(now)
                echo "fraud-check: 10 lakh jaanch ka batch $(( (b - a) * 10 )) ms mein poora"
              done
          resources:
            requests: { cpu: 100m, memory: 16Mi }
            limits:   { cpu: 200m, memory: 32Mi }     # 🐛 CPU limit kaam ki zaroorat (1 core) se 5 guna kam
