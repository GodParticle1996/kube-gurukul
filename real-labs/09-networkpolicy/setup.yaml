# =====================================================================
#  Lab 09 — NetworkPolicy: zero-trust (default deny + sirf zaroori raaste)
#  Shuru:  ./check-enforcement.sh   (pehle dekho tumhara CNI policies maanta hai ya nahi)
#          kubectl apply -f setup.yaml
#  Abhi: koi policy nahi → SAB sab se baat kar sakte hain (attacker bhi!)
# =====================================================================
apiVersion: v1
kind: Namespace
metadata:
  name: lab09
---
apiVersion: v1
kind: Pod
metadata:
  name: frontend
  namespace: lab09
  labels: { app: frontend }
spec:
  terminationGracePeriodSeconds: 1
  containers:
    - name: c
      image: busybox:1.36
      command: ["sleep", "86400"]
      resources: { requests: { cpu: 10m, memory: 8Mi }, limits: { memory: 16Mi } }
---
apiVersion: v1
kind: Pod
metadata:
  name: backend
  namespace: lab09
  labels: { app: backend }
spec:
  terminationGracePeriodSeconds: 1
  containers:
    - name: api
      image: busybox:1.36
      command: ["sh", "-c", "mkdir -p /w && echo backend-ok > /w/index.html && exec httpd -f -h /w -p 8080"]
      ports: [{ containerPort: 8080 }]
      resources: { requests: { cpu: 10m, memory: 8Mi }, limits: { memory: 16Mi } }
---
apiVersion: v1
kind: Pod
metadata:
  name: db
  namespace: lab09
  labels: { app: db }
spec:
  terminationGracePeriodSeconds: 1
  containers:
    - name: db
      image: busybox:1.36
      command: ["sh", "-c", "mkdir -p /w && echo db-ok > /w/index.html && exec httpd -f -h /w -p 5432"]
      ports: [{ containerPort: 5432 }]
      resources: { requests: { cpu: 10m, memory: 8Mi }, limits: { memory: 16Mi } }
---
# "attacker" — koi compromised pod jo namespace mein ghus gaya
apiVersion: v1
kind: Pod
metadata:
  name: attacker
  namespace: lab09
  labels: { app: attacker }
spec:
  terminationGracePeriodSeconds: 1
  containers:
    - name: c
      image: busybox:1.36
      command: ["sleep", "86400"]
      resources: { requests: { cpu: 10m, memory: 8Mi }, limits: { memory: 16Mi } }
---
apiVersion: v1
kind: Service
metadata: { name: backend, namespace: lab09 }
spec:
  selector: { app: backend }
  ports: [{ port: 80, targetPort: 8080 }]
---
apiVersion: v1
kind: Service
metadata: { name: db, namespace: lab09 }
spec:
  selector: { app: db }
  ports: [{ port: 5432, targetPort: 5432 }]
