# =====================================================================
#  Lab 13 — Jobs & CronJobs: retries, backoffLimit, overlapping runs
#  Shuru:  kubectl apply -f setup.yaml
# =====================================================================
apiVersion: v1
kind: Namespace
metadata:
  name: lab13
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: migrate-config
  namespace: lab13
data:
  TARGET: ""                    # kis schema version tak migrate karna hai
---
apiVersion: batch/v1
kind: Job
metadata:
  name: db-migrate
  namespace: lab13
spec:
  backoffLimit: 2               # 1 try + 2 retry, phir Job FAILED
  ttlSecondsAfterFinished: 3600 # khatam hone ke 1 ghante baad Job + pods apne-aap saaf
  template:
    spec:
      restartPolicy: Never      # Job mein sirf Never ya OnFailure (Always allowed nahi)
      containers:
        - name: migrate
          image: busybox:1.36
          command: ["sh", "-c"]
          args:
            - |
              if [ -z "$TARGET" ]; then echo "ERROR: TARGET schema version nahi diya — migration ruk gayi"; exit 1; fi
              echo "migrating schema → $TARGET ..."; sleep 3; echo "✅ migration done ($TARGET)"
          env:
            - name: TARGET
              valueFrom:
                configMapKeyRef:
                  name: migrate-config
                  key: TARGET
          resources:
            requests: { cpu: 10m, memory: 8Mi }
            limits: { memory: 16Mi }
---
# Har minute ek "report" — par report banne mein 90 sec lagte hain...
apiVersion: batch/v1
kind: CronJob
metadata:
  name: report
  namespace: lab13
spec:
  schedule: "*/1 * * * *"
  concurrencyPolicy: Allow
  jobTemplate:
    spec:
      backoffLimit: 0
      template:
        spec:
          restartPolicy: Never
          terminationGracePeriodSeconds: 1
          containers:
            - name: report
              image: busybox:1.36
              command: ["sh", "-c", "echo \"$(date +%T) report shuru\"; sleep 90; echo \"$(date +%T) report done\""]
              resources:
                requests: { cpu: 10m, memory: 8Mi }
                limits: { memory: 16Mi }
