# Lab 08 — SOLUTION
# 1) RoleBinding ka subject: ServiceAccount ka namespace lab08 (default nahi!)
# 2) nodes cluster-scoped hain → Role (namespace wala) unhe de hi nahi sakta → ClusterRole + ClusterRoleBinding
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: auditor-pod-reader
  namespace: lab08
subjects:
  - kind: ServiceAccount
    name: auditor
    namespace: lab08            # ✅ 1
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: pod-reader
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: lab08-node-reader       # ✅ 2 (cluster-scoped naam — sabhi namespaces mein unique)
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: lab08-auditor-node-reader
subjects:
  - kind: ServiceAccount
    name: auditor
    namespace: lab08
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: lab08-node-reader
