apiVersion: v1
kind: Service
metadata:
  name: {{ include "gurukul-web.fullname" . }}
  labels:
    {{- include "gurukul-web.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "gurukul-web.selectorLabels" . | nindent 4 }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
