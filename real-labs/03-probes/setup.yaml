# =====================================================================
#  Lab 03 — Probes: readiness, liveness, startup  (kaunsa probe kab?)
#  Shuru:  kubectl apply -f setup.yaml
#  Do apps, do alag probe-galtiyan.
# =====================================================================
apiVersion: v1
kind: Namespace
metadata:
  name: lab03
---
# ---------- App 1: shop (nginx) + Service ----------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shop
  namespace: lab03
spec:
  replicas: 2
  selector:
    matchLabels:
      app: shop
  template:
    metadata:
      labels:
        app: shop
    spec:
      containers:
        - name: web
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /ready
              port: 80
            periodSeconds: 5
          resources:
            requests: { cpu: 50m, memory: 32Mi }
            limits: { memory: 64Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: shop
  namespace: lab03
spec:
  selector:
    app: shop
  ports:
    - port: 80
      targetPort: 80
---
# ---------- App 2: slowapp — start hone mein ~25 sec lagte hain ----------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: slowapp
  namespace: lab03
spec:
  replicas: 1
  selector:
    matchLabels:
      app: slowapp
  template:
    metadata:
      labels:
        app: slowapp
    spec:
      terminationGracePeriodSeconds: 5
      containers:
        - name: app
          image: busybox:1.36
          command: ["sh", "-c"]
          args:
            - |
              echo "booting... (migrations + cache warm-up, ~25s)"
              sleep 25
              mkdir -p /www && echo "slowapp ok" > /www/index.html
              echo "ready — serving on :8080"
              exec httpd -f -h /www -p 8080
          ports:
            - containerPort: 8080
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 3
          resources:
            requests: { cpu: 20m, memory: 16Mi }
            limits: { memory: 32Mi }
---
# ---------- Client — andar se curl/wget karne ke liye ----------
apiVersion: v1
kind: Pod
metadata:
  name: client
  namespace: lab03
spec:
  containers:
    - name: c
      image: busybox:1.36
      command: ["sleep", "86400"]
      resources:
        requests: { cpu: 10m, memory: 8Mi }
        limits: { memory: 16Mi }
