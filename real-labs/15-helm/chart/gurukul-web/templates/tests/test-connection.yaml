# helm test <release> — yeh pod Service ko hit karta hai; exit 0 = test pass
apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "gurukul-web.fullname" . }}-test"
  labels:
    {{- include "gurukul-web.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  containers:
    - name: wget
      image: busybox:1.36
      command: ["sh", "-c"]
      args:
        - |
          # ConfigMap volume ka naya content pod tak ~1 min mein pahunchta hai (rollback ke turant baad bhi) → thoda retry
          for i in $(seq 1 30); do
            wget -qO- -T 3 http://{{ include "gurukul-web.fullname" . }}:{{ .Values.service.port }} | grep -qF {{ .Values.message | squote }} && exit 0
            sleep 3
          done
          echo "Service ne expected message nahi lautaya"; exit 1
