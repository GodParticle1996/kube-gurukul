apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "gurukul-web.fullname" . }}
  labels:
    {{- include "gurukul-web.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicacount }}
  selector:
    matchLabels:
      {{- include "gurukul-web.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "gurukul-web.selectorLabels" . | nindent 8 }}
      annotations:
        # ConfigMap badla → yeh hash badla → pod template badla → rollout apne-aap (Lab 07 yaad hai?)
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      terminationGracePeriodSeconds: 2
      containers:
        - name: web
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["httpd", "-f", "-h", "/www", "-p", "8080"]
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 3
          volumeMounts:
            - name: www
              mountPath: /www
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: www
          configMap:
            name: {{ include "gurukul-web.fullname" . }}
