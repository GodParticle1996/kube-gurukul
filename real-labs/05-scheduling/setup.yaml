# =====================================================================
#  Lab 05 — Pending pods: nodeSelector · taints/tolerations · resources
#  Shuru:  ./setup.sh   (yeh file apply karta hai + ssd node par taint lagata hai)
# =====================================================================
apiVersion: v1
kind: Namespace
metadata:
  name: lab05
---
# DB ko SIRF ssd wale node par chalna hai — woh node DB ke liye reserved (tainted) hai
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders-db
  namespace: lab05
spec:
  replicas: 1
  selector:
    matchLabels:
      app: orders-db
  template:
    metadata:
      labels:
        app: orders-db
    spec:
      nodeSelector:
        disktype: nvme
      containers:
        - name: db
          image: busybox:1.36
          command: ["sh", "-c", "echo 'db running on node with fast disk'; sleep 86400"]
          resources:
            requests: { cpu: 100m, memory: 32Mi }
            limits: { memory: 64Mi }
---
# Report worker — "zyada CPU maang lo, safe rahega" soch ke likha gaya
apiVersion: apps/v1
kind: Deployment
metadata:
  name: report-worker
  namespace: lab05
spec:
  replicas: 1
  selector:
    matchLabels:
      app: report-worker
  template:
    metadata:
      labels:
        app: report-worker
    spec:
      containers:
        - name: worker
          image: busybox:1.36
          command: ["sh", "-c", "echo 'generating reports...'; sleep 86400"]
          resources:
            requests: { cpu: "500", memory: 32Mi }
            limits: { memory: 64Mi }
