# =====================================================================
#  Lab 10 — HPA: load badhe toh pods badhein (aur kyun "<unknown>" dikhta hai)
#  Pehle:  kubectl top nodes   (metrics-server chahiye — nahi hai toh: ../setup.sh metrics)
#  Shuru:  kubectl apply -f setup.yaml
# =====================================================================
apiVersion: v1
kind: Namespace
metadata:
  name: lab10
---
# cpu-api: har request par thoda CPU jalata hai (busybox httpd + CGI script)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cpu-api
  namespace: lab10
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cpu-api
  template:
    metadata:
      labels:
        app: cpu-api
    spec:
      terminationGracePeriodSeconds: 2
      containers:
        - name: api
          image: busybox:1.36
          command: ["sh", "-c"]
          args:
            - |
              mkdir -p /w/cgi-bin
              printf '#!/bin/sh\necho "Content-Type: text/plain"\necho ""\ni=0; while [ $i -lt 20000 ]; do i=$((i+1)); done\necho "kaam ho gaya ($i)"\n' > /w/cgi-bin/work
              chmod +x /w/cgi-bin/work
              echo ok > /w/index.html
              exec httpd -f -h /w -p 8080
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet: { path: /, port: 8080 }
            periodSeconds: 5
          resources:
            limits:
              memory: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: cpu-api
  namespace: lab10
spec:
  selector:
    app: cpu-api
  ports:
    - port: 80
      targetPort: 8080
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: cpu-api
  namespace: lab10
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: cpu-api
  minReplicas: 1
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 50     # "request ka 50%" — request hi nahi toh % kiska?
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 60  # demo ke liye 1 min (default 5 min)
---
# Load generator — abhi 0 replicas. Load chahiye toh scale karo.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: loadgen
  namespace: lab10
spec:
  replicas: 0
  selector:
    matchLabels:
      app: loadgen
  template:
    metadata:
      labels:
        app: loadgen
    spec:
      terminationGracePeriodSeconds: 1
      containers:
        - name: hammer
          image: busybox:1.36
          command: ["sh", "-c", "while true; do wget -qO- -T 5 http://cpu-api/cgi-bin/work >/dev/null 2>&1; done"]
          resources:
            requests: { cpu: 50m, memory: 8Mi }
            limits: { memory: 16Mi }
