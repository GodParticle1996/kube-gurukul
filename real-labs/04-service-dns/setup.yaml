# =====================================================================
#  Lab 04 — Service nahi mil rahi  (selector · targetPort · DNS)
#  Shuru:  kubectl apply -f setup.yaml
#  Traffic ka raasta:  client → DNS naam → Service → selector → Pod ka port
#  Is raaste mein TEEN jagah gadbad hai.
# =====================================================================
apiVersion: v1
kind: Namespace
metadata:
  name: lab04
---
apiVersion: v1
kind: Namespace
metadata:
  name: lab04-frontend
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payments
  namespace: lab04
spec:
  replicas: 2
  selector:
    matchLabels:
      app: payments
  template:
    metadata:
      labels:
        app: payments
        tier: backend
    spec:
      containers:
        - name: api
          image: nginx:1.27-alpine
          ports:
            - name: http
              containerPort: 80
          resources:
            requests: { cpu: 50m, memory: 32Mi }
            limits: { memory: 64Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: payments
  namespace: lab04
spec:
  selector:
    app: payment
  ports:
    - port: 80
      targetPort: 8080
---
# frontend doosre namespace mein hai — payments ko is URL se bulata hai
apiVersion: v1
kind: ConfigMap
metadata:
  name: frontend-config
  namespace: lab04-frontend
data:
  PAYMENTS_URL: "http://payments"
---
apiVersion: v1
kind: Pod
metadata:
  name: client
  namespace: lab04-frontend
spec:
  containers:
    - name: c
      image: busybox:1.36
      command: ["sleep", "86400"]
      resources:
        requests: { cpu: 10m, memory: 8Mi }
        limits: { memory: 16Mi }
