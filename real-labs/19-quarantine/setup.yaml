# =====================================================================
#  Lab 19 — Quarantine: hack hue pod ko alag karo, par maaro mat
#  Shuru:  kubectl apply -f setup.yaml
#          ./attack.sh        (ek notify pod ko "compromise" karta hai aur alert dikhata hai)
#  Kahani: ChaiPay ke notify ke 2 pods hain. Ek pod mein attacker ghus gaya (nakli crypto-miner "xmrig").
#  Abhi:   koi NetworkPolicy nahi → hack hua pod ledger tak pahunch sakta hai.
# =====================================================================
apiVersion: v1
kind: Namespace
metadata:
  name: lab19
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notify
  namespace: lab19
spec:
  replicas: 2
  selector:
    matchLabels: { app: notify }
  template:
    metadata:
      labels: { app: notify }
    spec:
      terminationGracePeriodSeconds: 1
      containers:
        - name: notify
          image: busybox:1.36
          command: ["sh", "-c", "mkdir -p /w && echo notify-ok > /w/index.html && exec httpd -f -h /w -p 8080"]
          ports: [{ containerPort: 8080 }]
          resources: { requests: { cpu: 10m, memory: 8Mi }, limits: { memory: 32Mi } }
---
apiVersion: v1
kind: Service
metadata:
  name: notify
  namespace: lab19
spec:
  selector: { app: notify }
  ports:
    - port: 80
      targetPort: 8080
---
# ledger — paise ka hisaab. Attacker ka asli nishana.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ledger
  namespace: lab19
spec:
  replicas: 1
  selector:
    matchLabels: { app: ledger }
  template:
    metadata:
      labels: { app: ledger }
    spec:
      terminationGracePeriodSeconds: 1
      containers:
        - name: ledger
          image: busybox:1.36
          command: ["sh", "-c", "mkdir -p /w && echo ledger-ok > /w/index.html && exec httpd -f -h /w -p 8080"]
          ports: [{ containerPort: 8080 }]
          resources: { requests: { cpu: 10m, memory: 8Mi }, limits: { memory: 16Mi } }
---
apiVersion: v1
kind: Service
metadata:
  name: ledger
  namespace: lab19
spec:
  selector: { app: ledger }
  ports:
    - port: 80
      targetPort: 8080
---
# client — ek aam user ki jagah. Isse jaanchte hain ki notify Service chal rahi hai.
apiVersion: v1
kind: Pod
metadata:
  name: client
  namespace: lab19
  labels: { app: client }
spec:
  terminationGracePeriodSeconds: 1
  containers:
    - name: client
      image: busybox:1.36
      command: ["sleep", "86400"]
      resources: { requests: { cpu: 10m, memory: 8Mi }, limits: { memory: 16Mi } }
