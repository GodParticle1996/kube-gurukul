# KubeGurukul real-labs — 3 node ka kind cluster (1 control-plane + 2 workers)
#   kind create cluster --config kind-config.yaml
# Worker labels scheduling labs (05) mein kaam aate hain:
#   gurukul-worker  → gurukul/zone=zone-a
#   gurukul-worker2 → gurukul/zone=zone-b, disktype=ssd
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: gurukul
nodes:
  - role: control-plane
  - role: worker
    labels:
      gurukul/zone: zone-a
  - role: worker
    labels:
      gurukul/zone: zone-b
      disktype: ssd
