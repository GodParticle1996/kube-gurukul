# Lab 05 — SOLUTION
# orders-db:     nodeSelector sahi label (ssd)  → node CHUNTA hai  (attract)
#                + toleration                    → taint ko SEHTA hai (permit)
#                (dono chahiye! toleration akele pod ko us node par KHEECHTA nahi)
# report-worker: request asli zaroorat jitni — "500 CPU" kisi node par nahi hai
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders-db
  namespace: lab05
spec:
  replicas: 1
  selector:
    matchLabels:
      app: orders-db
  template:
    metadata:
      labels:
        app: orders-db
    spec:
      nodeSelector:
        disktype: ssd                    # ✅ attract
      tolerations:
        - key: dedicated                 # ✅ permit
          operator: Equal
          value: database
          effect: NoSchedule
      containers:
        - name: db
          image: busybox:1.36
          command: ["sh", "-c", "echo 'db running on node with fast disk'; sleep 86400"]
          resources:
            requests: { cpu: 100m, memory: 32Mi }
            limits: { memory: 64Mi }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: report-worker
  namespace: lab05
spec:
  replicas: 1
  selector:
    matchLabels:
      app: report-worker
  template:
    metadata:
      labels:
        app: report-worker
    spec:
      containers:
        - name: worker
          image: busybox:1.36
          command: ["sh", "-c", "echo 'generating reports...'; sleep 86400"]
          resources:
            requests: { cpu: 250m, memory: 32Mi }   # ✅ asli zaroorat
            limits: { memory: 64Mi }
