# Lab 02 — SOLUTION: tag ki spelling (alpne → alpine)
# Production tip: tag ki jagah digest pin karo (nginx@sha256:...) — tag badal sakta hai, digest nahi.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: storefront
  namespace: lab02
spec:
  replicas: 2
  selector:
    matchLabels:
      app: storefront
  template:
    metadata:
      labels:
        app: storefront
    spec:
      containers:
        - name: web
          image: nginx:1.27-alpine        # ✅
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              memory: 64Mi
